<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCut — حاسبة الخصم</title>
    <meta name="description" content="أداة حاسبة الخصم الذكية لحساب نسبة الخصم والتوفير والسعر النهائي فورياً. تطوير أدم رسلان.">
    
    <!-- كود إثبات ملكية جوجل Search Console -->
    <meta name="google-site-verification" content="cBmtHA6xp1PbgqBcRE6hCKbbk0-OwS46D4eyAebjyx4" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #38bdf8;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            border: 1px dashed #334155;
            text-align: center;
        }

        .result-item {
            margin-bottom: 10px;
            font-size: 15px;
            color: #cbd5e1;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .final-price {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
            margin-top: 5px;
        }

        .footer-credit {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }

        .footer-credit span {
            color: #38bdf8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <h2>SmartCut — حاسبة الخصم 🏷️</h2>
        
        <div class="input-group">
            <label for="price">السعر الأصلي (جنيه):</label>
            <input type="number" id="price" placeholder="أدخل السعر هنا..." oninput="calculate()">
        </div>

        <div class="input-group">
            <label for="discount">نسبة الخصم (%):</label>
            <input type="number" id="discount" placeholder="أدخل نسبة الخصم..." oninput="calculate()">
        </div>

        <div class="result-box">
            <div class="result-item">قيمة التوفير: <span id="savedAmount" style="color: #4ade80; font-weight: bold;">0.00</span> جنيه</div>
            <div class="result-item" style="margin-top: 10px;">السعر بعد الخصم:</div>
            <div class="final-price"><span id="finalPrice">0.00</span> جنيه</div>
        </div>

        <div class="footer-credit">
            تم التطوير بواسطة <span> أدم رسلان </span> 🚀
        </div>
    </div>

    <script>
        function calculate() {
            let price = parseFloat(document.getElementById('price').value);
            let discount = parseFloat(document.getElementById('discount').value);

            let savedAmountSpan = document.getElementById('savedAmount');
            let finalPriceSpan = document.getElementById('finalPrice');

            if (isNaN(price) || price <= 0) {
                savedAmountSpan.innerText = "0.00";
                finalPriceSpan.innerText = "0.00";
                return;
            }

            if (isNaN(discount) || discount < 0) {
                discount = 0;
            }

            let saved = (price * discount) / 100;
            let final = price - saved;

            savedAmountSpan.innerText = saved.toFixed(2);
            finalPriceSpan.innerText = final.toFixed(2);
        }
    </script>

</body>
</html>
